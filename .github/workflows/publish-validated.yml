name: Publish validated B0 and M1
on:
  push:
    branches: [release/v3-unified]
    paths: [.release/PUBLISH]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3-unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check immutable source and completed build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e5fc77e09304739ee9d31bbce2143b09e7a74f98"
          test "$(git ls-remote origin refs/heads/archive/main-before-v3-20260918 | cut -f1)" = "e5fc77e09304739ee9d31bbce2143b09e7a74f98"
          python - <<'PY'
          import json,pathlib,subprocess
          marker=json.loads(pathlib.Path('.release/PUBLISH').read_text())
          assert marker['run_id']==35387333583
          data=json.loads(subprocess.check_output(['gh','api',f'repos/suharevalexey/Case/actions/runs/{marker["run_id"]}/jobs?filter=all']))
          assert any(j['name']=='build' and j['conclusion']=='success' for j in data['jobs']), 'The experiment build is not successful'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: validated-source
          run-id: 35387333583
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated
      - uses: actions/download-artifact@v4
        with:
          name: B0-M1-checkpoints
          run-id: 35387333583
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@v4
        with:
          name: experiment-evidence
          run-id: 35387333583
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/assets
      - name: Assemble the release and synchronize the CSV manifest
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv,hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('.')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'validated/case-validated.zip'
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              for item in z.infolist():
                  p=pathlib.Path(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if name and name not in names: pathlib.Path(name).unlink(missing_ok=True)
              z.extractall(root)
          # The JSON manifest already verified all 20 raw files. The CSV view
          # was missing one row; synchronize metadata, never change a raw hash.
          entries=json.loads(pathlib.Path('data/dataset_manifest.json').read_text())
          assert len(entries)==20
          for item in entries:
              raw=pathlib.Path('data/raw')/item['group']/item['filename']
              assert hashlib.sha256(raw.read_bytes()).hexdigest()==item['sha256']
          with pathlib.Path('data/dataset_manifest.csv').open('w',encoding='utf-8',newline='') as stream:
              writer=csv.DictWriter(stream,fieldnames=list(entries[0]),lineterminator='\n')
              writer.writeheader(); writer.writerows(entries)
          test=pathlib.Path('tests/test_data_and_models.py'); text=test.read_text()
          needle="    f=pd.read_csv(DATA/'dataset_combined.csv')"
          addition="    expected=pd.DataFrame(json.loads((ROOT/'data/dataset_manifest.json').read_text()))\n    view=pd.read_csv(ROOT/'data/dataset_manifest.csv')\n    order=['group','filename']\n    pd.testing.assert_frame_equal(expected.sort_values(order).reset_index(drop=True),view.sort_values(order).reset_index(drop=True),check_dtype=False)\n"
          assert text.count(needle)==1
          test.write_text(text.replace(needle,addition+needle))
          record={'publication_run_id':os.environ['BUILD_RUN_ID'],'controlled_experiment_workflow':35387333583,
                  'trigger_sha':os.environ['EXPECTED_SHA'],'source_archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                  'archive_branch':'archive/main-before-v3-20260918',
                  'post_experiment_changes':['Synchronize the CSV raw manifest with the verified 20-row JSON manifest','Strengthen the existing manifest consistency test','Rebuild documentation and validation logs'],
                  'no_change_to_training_data_weights_candidates_or_metric_definitions':True}
          pathlib.Path('results/release_build.json').write_text(json.dumps(record,indent=2)+'\n')
          sealed={}
          for base in ['case','data/processed','models','inputs','results/main','results/ablation_no_AD']:
              for p in pathlib.Path(base).rglob('*'):
                  if p.is_file() and p.suffix not in {'.pyc','.npz'} and p.name!='README.md': sealed[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path(os.environ['RUNNER_TEMP'],'sealed_scientific_files.json').write_text(json.dumps(sealed))
          PY
      - name: Recheck tests, sealed results and the six-page report
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q --junitxml=results/test_results.xml | tee results/test_results.log
          python pipeline.py verify --complete
          python pipeline.py report
          python - <<'PY'
          import hashlib,json,os,pathlib
          sealed=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'sealed_scientific_files.json').read_text())
          for name,digest in sealed.items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest, name
          print('Scientific code, data, weights, frozen candidates and result tables unchanged')
          PY
      - name: Push the verified tree and create version 3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/release/v3-unified | cut -f1)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e5fc77e09304739ee9d31bbce2143b09e7a74f98"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release unified B0 and M1 with verified data, models, three-seed experiments and report'
          git push origin HEAD:release/v3-unified
          git archive --format=zip HEAD > "$RUNNER_TEMP/assets/Case-v3.0.0.zip"
          gh release create v3.0.0 --target "$(git rev-parse HEAD)" --title 'Case 3.0.0 - B0 and M1' --notes-file CHANGELOG.md "$RUNNER_TEMP/assets/Case-v3.0.0.zip" "$RUNNER_TEMP/assets/B0_M1_checkpoints.zip" "$RUNNER_TEMP/assets/run-evidence.zip" docs/REPORT.pdf
          if test "$(gh api repos/suharevalexey/Case/git/ref/heads/ci/v3-workflow --jq .object.sha)" = "bb031fbffedbee81c46d1d1ed9efa9755420cb56"; then
            gh api -X DELETE repos/suharevalexey/Case/git/refs/heads/ci/v3-workflow
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-v3-source
          path: |
            ${{ runner.temp }}/assets/Case-v3.0.0.zip
            docs/REPORT.pdf
            results/release_build.json
          if-no-files-found: ignore
          retention-days: 30
